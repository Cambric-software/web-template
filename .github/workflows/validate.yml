name: Cambric Web Validation

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate required files
        shell: pwsh
        run: ./scripts/doctor.ps1

      - name: Secret scan
        shell: pwsh
        run: ./security/secret-scan.ps1

      - name: Run tests
        shell: pwsh
        run: ./tests/run-tests.ps1
