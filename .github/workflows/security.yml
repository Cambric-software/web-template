name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  security:
    name: Audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Search for private-key material
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' .; then
            echo "Potential private key material detected."
            exit 1
          fi

      - name: Check for common API key patterns
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            'sk-[A-Za-z0-9]{20,}' .; then
            echo "Potential hard-coded API key detected."
            exit 1
          fi
